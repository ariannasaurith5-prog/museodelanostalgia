<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recorrido · Museo de la Nostalgia</title>
<meta name="description" content="Recorrido por las salas del Museo de la Nostalgia: literatura juvenil de 2009 a 2015.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,700;1,6..96,400;1,6..96,700&family=Crimson+Pro:ital,wght@0,400;0,500;1,400&family=Archivo:wght@400;500;700&display=swap">
<link rel="stylesheet" href="base.css?v=4">
<link rel="stylesheet" href="recorrido.css?v=4">
</head>
<body>

<canvas id="polvo" aria-hidden="true"></canvas>

<header class="barra">
  <a class="marca" href="index.html" title="Volver a la sala principal">Museo de la <em>Nostalgia</em></a>
  <nav class="menu" aria-label="Menú del museo">
    <a class="menu-link" href="index.html">Sala principal</a>
    <div class="salas" id="salas"></div>
    <a class="menu-link" href="muro.html">V · Muro 2014</a>
    <details class="indice" id="indice">
      <summary>Colección</summary>
      <ul class="indice-lista" id="indice-lista"></ul>
    </details>
  </nav>
</header>

<!-- Las salas se arman desde js/coleccion.js -->
<main class="sala" id="sala" tabindex="0" aria-label="Recorrido del museo"></main>

<footer class="pie">
  <a class="volver" href="index.html">← Sala principal</a>
  <span id="ubicacion">Entrada</span>
  <div class="plano" id="plano" role="group" aria-label="Plano del museo"></div>
</footer>

<div class="vitrina" id="vitrina" role="dialog" aria-modal="true" aria-labelledby="vitrina-titulo" data-abierta="false">
  <button class="cerrar" id="cerrar" type="button" aria-label="Cerrar pieza">✕</button>
  <div class="vitrina-caja">
    <div class="vitrina-marco" id="vitrina-marco"></div>
    <div class="vitrina-texto">
      <p class="num" id="vitrina-sala"></p>
      <h2 id="vitrina-titulo"></h2>
      <p class="credito" id="vitrina-credito"></p>
      <p class="saga" id="vitrina-saga"></p>
      <div id="vitrina-cuerpo"></div>

      <section class="bloque" id="bloque-autor">
        <h4>El autor</h4>
        <div class="autor-cabeza">
          <img class="autor-foto" id="autor-foto" alt="" hidden>
          <div>
            <p class="autor-nombre" id="autor-nombre"></p>
            <p class="film-meta" id="autor-origen"></p>
          </div>
        </div>
        <p id="autor-texto"></p>
        <p class="film-meta" id="autor-obras"></p>
      </section>

      <section class="bloque">
        <h4>La adaptación</h4>
        <p id="vitrina-film"></p>
        <p class="film-meta" id="vitrina-film-meta"></p>
      </section>

      <section class="bloque" id="bloque-pistas">
        <h4>Banda sonora</h4>
        <div class="spotify" id="vitrina-spotify" hidden></div>
        <ul class="pistas" id="vitrina-pistas"></ul>
      </section>

      <section class="bloque">
        <h4>Ficha técnica</h4>
        <dl class="ficha" id="vitrina-ficha"></dl>
      </section>

      <div class="acciones">
        <button type="button" id="anterior">← Pieza anterior</button>
        <button type="button" id="siguiente">Siguiente pieza →</button>
      </div>
    </div>
  </div>
</div>

<script src="coleccion.js?v=4"></script>
<script src="portada.js?v=4"></script>
<script src="recorrido.js?v=4"></script>
</body>
</html>
